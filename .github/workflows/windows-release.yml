name: Windows installer release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for retrying a release)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run lint

      - name: Build Windows installer
        run: pnpm run package:win

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -ne "v$version") { throw "Tag $tag does not match package version $version." }
          $installers = @(Get-ChildItem -File 'release-installer/MonitorStats-Setup-*.exe')
          if ($installers.Count -ne 1) { throw "Expected one installer artifact; found $($installers.Count)." }
          $installer = $installers[0]
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          $changelog = Get-Content 'CHANGELOG.md' -Raw
          $section = [regex]::Match($changelog, "(?ms)^##\s+$([regex]::Escape($version))\b.*?(?=^##\s+|\z)")
          if (-not $section.Success) { throw "No CHANGELOG.md section found for version $version." }
          $notes = "$($section.Value.Trim())`n`nSHA-256: $hash"
          $releaseTitle = "MonitorStats $tag"

          # A release may have been created manually before this workflow runs.
          # Update its installer and notes instead of failing on the duplicate tag.
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not upload installer to existing release $tag." }
            gh release edit $tag --title $releaseTitle --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Could not update notes for existing release $tag." }
          } else {
            gh release create $tag $installer.FullName --title $releaseTitle --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create GitHub release $tag." }
          }
