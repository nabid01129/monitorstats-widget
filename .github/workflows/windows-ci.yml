name: Windows build checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run lint

      - name: Build UI
        run: pnpm run build

      - name: Compile Windows helpers
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File electron/build-fancontrol-reader.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File electron/build-foreground-monitor.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
