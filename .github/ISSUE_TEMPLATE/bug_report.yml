name: Bug report
description: Report a reproducible problem with MonitorStats Widget.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.3.36
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that lead to the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: sensors
    attributes:
      label: Relevant sensor sources
      description: Include the app/driver source and units if known. Redact public/local IPs, serial numbers, and credentials.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, IP addresses, and identifying information from logs and screenshots.
          required: true
